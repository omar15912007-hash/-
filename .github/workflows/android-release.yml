name: Android CI/CD Release & Auto-Update

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.0.1)'
        required: false
        default: ''
      changelog:
        description: 'Release Notes / Changelog'
        required: false
        default: 'تحسينات في الأداء وإصلاح الأخطاء.'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🔧 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🏷️ Determine Version and Tag
        id: versioning
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION_NAME="${TAG_NAME#v}"
          elif [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION_NAME="${{ github.event.inputs.version_name }}"
            TAG_NAME="v${VERSION_NAME}"
          else
            # Extract versionName from app/build.gradle.kts or version.json
            VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "1.0.0")
            TAG_NAME="v${VERSION_NAME}"
          fi
          
          # Compute numeric versionCode: e.g. 1.0.0 -> 10000
          IFS='.' read -r major minor patch <<< "$VERSION_NAME"
          major=${major:-1}
          minor=${minor:-0}
          patch=${patch:-0}
          VERSION_CODE=$(( major * 10000 + minor * 100 + patch ))
          
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Resolved Version: $VERSION_NAME ($VERSION_CODE) with Tag: $TAG_NAME"

      - name: 🔨 Build Release APK (R8 Minified)
        run: ./gradlew assembleRelease --no-daemon

      - name: 📦 Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          APK_FOUND=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          
          if [ -n "$APK_FOUND" ] && [ -f "$APK_FOUND" ]; then
            echo "Found APK at $APK_FOUND"
            cp "$APK_FOUND" "release-artifacts/NabdAlDhikr.apk"
          else
            echo "Error: Release APK not found in app/build/outputs/apk/release"
            exit 1
          fi

          CHANGELOG="${{ github.event.inputs.changelog }}"
          if [ -z "$CHANGELOG" ]; then
            if [ -f "version.json" ]; then
              CHANGELOG=$(jq -r '.changelog // "تحسينات عامة وإصلاحات."' version.json 2>/dev/null || echo "تحسينات عامة وإصلاحات.")
            else
              CHANGELOG="إصدار موحد شامل لتطبيق نبض الذكر v${{ env.VERSION_NAME }}."
            fi
          fi

          # Generate dynamic version.json for in-app OTA auto-updater
          cat <<EOF > release-artifacts/version.json
          {
            "versionCode": ${{ env.VERSION_CODE }},
            "versionName": "${{ env.VERSION_NAME }}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/NabdAlDhikr.apk",
            "changelog": "$CHANGELOG",
            "forceUpdate": false
          }
          EOF
          
          echo "Generated version.json:"
          cat release-artifacts/version.json

      - name: 📤 Upload Build Artifacts (Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: NabdAlDhikr-v${{ env.VERSION_NAME }}-APK
          path: release-artifacts/*

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "نبض الذكر ${{ env.TAG_NAME }}"
          body: |
            ### 🌟 نبض الذكر (Nabd Al-Dhikr) - ${{ env.TAG_NAME }}
            
            تطبيق إسلامي موحد، فائق الخفة وشامل لجميع أجهزة الأندرويد.
            
            #### 📱 المميزات والتحسينات في هذا الإصدار:
            ${{ github.event.inputs.changelog || '• ملف تثبيت موحد (NabdAlDhikr.apk) لجميع المعماريات والأجهزة.\n• إدارة متكاملة وسلسة لكافة الأذونات (تثبيت التحديثات، إشعارات الأذكار، وتحديد اتجاه القبلة).\n• نظام تحديث تلقائي داخلي بضغطة زر واحدة (OTA Self-Update).\n• موسوعة أذكار حصن المسلم المحققة كاملاً مع السبحة وبوصلة القبلة الفلكية.' }}
            
            ---
            **حجم التطبيق:** ~2.3 MB  
            **الملف الرسمي الموحد:** `NabdAlDhikr.apk`
          draft: false
          prerelease: false
          files: |
            release-artifacts/NabdAlDhikr.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
